apiVersion: apps/v1
kind: Deployment
metadata:
  name: gopro-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gopro-demo
  template:
    metadata:
      labels:
        app: gopro-demo
    spec:
      containers:
        - name: gopro-demo
          image: keerthana2003bggowd/gopro-demo:latest
          imagePullPolicy: Always
          ports:
            containerPort: 3001
---

apiVersion: v1
kind: Service
metadata:
  name: gopro-demo-svc
spec:
  type: NodePort
  selector:
    app: gopro-demo
  ports:
  - port: 3001
    targetPort: 3001
    nodePort: 30092


